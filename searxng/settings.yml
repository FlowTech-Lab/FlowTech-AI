# Load community-provided settings, optimized for production
use_default_settings: true

# Disable only "yacy images" engine to avoid "Missing engine config attribute" error
disabled_engines:
  - "yacy images"

# If needed to limit some engines considered too slow or resource-intensive:
# engines:
#   - name: google
#     engine: google
#     disabled: false
#   - name: bing
#     engine: bing
#     disabled: false
#   # etc.

# DOI resolvers (preserved)
default_doi_resolver: 'oadoi.org'
doi_resolvers:
  oadoi.org: 'https://oadoi.org/'
  doi.org: 'https://doi.org/'
  doai.io: 'https://dissem.in/'
  sci-hub.se: 'https://sci-hub.se/'
  sci-hub.st: 'https://sci-hub.st/'
  sci-hub.ru: 'https://sci-hub.ru/'

# Server
server:
  bind_address: 0.0.0.0
  port: 8080
  base_url: "http://127.0.0.1:8082/"
  secret_key: "<RANDOM_SECRET_KEY>"
  limiter: false
  trust_http_x_forwarded_for: true   # useful if behind reverse-proxy
  num_proxies: 1                     # number of X-Forwarded-For hops

# Anti-bot (disabled locally, enable in prod)
botdetection:
  enabled: false

# Search
search:
  safe_search: 0                     # 0=off, 1=moderate, 2=strict
  formats: [html, json, rss]         # RSS added for syndication

# User interface
ui:
  theme_args:
    theme: auto

# Logging (optional, for debug)
logging:
  level:
    root: INFO
    searx: WARNING
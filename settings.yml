# Charge les paramètres fournis par la communauté, optimisés pour production
use_default_settings: true

# Désactive uniquement l’engine “yacy images” pour éviter l’erreur "Missing engine config attribute"
disabled_engines:
  - "yacy images"

# Si besoin de limiter certains moteurs jugés trop lents ou gourmands :
# engines:
#   - name: google
#     engine: google
#     disabled: false
#   - name: bing
#     engine: bing
#     disabled: false
#   # etc.

# Résolveurs de DOI (conserve)
default_doi_resolver: 'oadoi.org'
doi_resolvers:
  oadoi.org: 'https://oadoi.org/'
  doi.org: 'https://doi.org/'
  doai.io: 'https://dissem.in/'
  sci-hub.se: 'https://sci-hub.se/'
  sci-hub.st: 'https://sci-hub.st/'
  sci-hub.ru: 'https://sci-hub.ru/'

# Serveur
server:
  bind_address: 0.0.0.0
  port: 8080
  base_url: "http://127.0.0.1:8082/"
  secret_key: "<CLE_SECRETE_ALÉATOIRE>"
  limiter: false
  trust_http_x_forwarded_for: true   # utile si derrière un reverse-proxy
  num_proxies: 1                     # nombre de sauts X-Forwarded-For

# Anti-bot (désactivé en local, à activer en prod)
botdetection:
  enabled: false

# Recherche
search:
  safe_search: 0                     # 0=off, 1=modéré, 2=strict
  formats: [html, json, rss]         # RSS ajouté pour syndication

# Interface utilisateur
ui:
  theme_args:
    theme: auto

# Logging (optionnel, pour debug)
logging:
  level:
    root: INFO
    searx: WARNING
